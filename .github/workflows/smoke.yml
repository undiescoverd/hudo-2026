name: Staging Smoke (seven flows)

# S4-LAUNCH-002. Drives register, invite, upload, comment, PDF export, guest link and a
# Stripe test-mode upgrade against the deployed staging app, then purges the test agency.
#
# Required repository secrets (nothing is hardcoded; the repo is public):
#   PLAYWRIGHT_TEST_URL              staging base URL (same secret playwright.yml uses)
#   SMOKE_SUPABASE_URL               staging Supabase project URL
#   SMOKE_SUPABASE_SERVICE_ROLE_KEY  staging service-role key (cleanup via purge_agency + test seams)
#   SMOKE_EMAIL_DOMAIN               domain you control for generated addresses (no default)
# Required repository variable:
#   SMOKE_SUPABASE_PROJECT_REF       staging Supabase project ref; the run refuses any other project
# Optional secrets / variables:
#   SMOKE_CRON_SECRET                lets cleanup drain the R2 storage_deletions queue immediately
#   SMOKE_EXPECT_WEBHOOK (variable)  "true" once the staging Stripe test webhook is configured
# Human-only prerequisites: staging Stripe test webhook; Supabase "confirm email" setting on
# staging (the suite works either way); NEXT_PUBLIC_BILLING_ENABLED=true on staging.
# Test-user passwords are generated per run inside the fixture; no password secret exists.
# The URL comes only from the PLAYWRIGHT_TEST_URL secret (no dispatch override).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-smoke
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    name: Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # FAIL (never skip) when the target is not configured. playwright.yml exits 0 here;
      # a smoke suite that silently passes on a missing URL is worse than none.
      - name: Require staging URL and secrets
        env:
          PLAYWRIGHT_TEST_URL: ${{ secrets.PLAYWRIGHT_TEST_URL }}
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_EMAIL_DOMAIN: ${{ secrets.SMOKE_EMAIL_DOMAIN }}
          SMOKE_SUPABASE_PROJECT_REF: ${{ vars.SMOKE_SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          for v in PLAYWRIGHT_TEST_URL SMOKE_SUPABASE_URL SMOKE_SUPABASE_SERVICE_ROLE_KEY SMOKE_EMAIL_DOMAIN SMOKE_SUPABASE_PROJECT_REF; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Smoke suite cannot run, missing:$missing"
            exit 1
          fi
          # Refuse any Supabase project other than staging: the run purges data.
          host=$(printf '%s' "$SMOKE_SUPABASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          if [ "$host" != "$SMOKE_SUPABASE_PROJECT_REF.supabase.co" ]; then
            echo "::error::SMOKE_SUPABASE_URL host does not match SMOKE_SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # On push, Vercel deploys main in parallel with this workflow. Wait for the deployment
      # of THIS commit to report success, then for the URL to answer. (workflow_dispatch has
      # no commit to wait on and goes straight to the URL probe.)
      - name: Wait for Vercel deployment
        env:
          PLAYWRIGHT_TEST_URL: ${{ secrets.PLAYWRIGHT_TEST_URL }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT" = "push" ]; then
            echo "Waiting for a successful deployment of $SHA ..."
            ok=""
            for i in $(seq 1 60); do
              ids=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&per_page=20" --jq '.[].id' || true)
              for id in $ids; do
                state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" --jq '.[0].state' || true)
                if [ "$state" = "success" ]; then ok=1; break; fi
              done
              [ -n "$ok" ] && break
              echo "  not ready yet ($i/60)"; sleep 15
            done
            if [ -z "$ok" ]; then echo "::error::No successful Vercel deployment for $SHA within 15 minutes"; exit 1; fi
          fi
          echo "Probing $PLAYWRIGHT_TEST_URL ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$PLAYWRIGHT_TEST_URL/auth/signin" || echo 000)
            if [ "$code" = "200" ]; then echo "Deployment is serving (200)."; exit 0; fi
            echo "  HTTP $code ($i/30)"; sleep 10
          done
          echo "::error::$PLAYWRIGHT_TEST_URL did not return 200 within 5 minutes"
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          PLAYWRIGHT_TEST_URL: ${{ secrets.PLAYWRIGHT_TEST_URL }}
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_SUPABASE_PROJECT_REF: ${{ vars.SMOKE_SUPABASE_PROJECT_REF }}
          SMOKE_EMAIL_DOMAIN: ${{ secrets.SMOKE_EMAIL_DOMAIN }}
          SMOKE_CRON_SECRET: ${{ secrets.SMOKE_CRON_SECRET }}
          SMOKE_EXPECT_WEBHOOK: ${{ vars.SMOKE_EXPECT_WEBHOOK }}
        run: pnpm exec playwright test -c tests/e2e/smoke/playwright.smoke.config.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7
