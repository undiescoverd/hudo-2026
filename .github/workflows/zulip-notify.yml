name: Zulip Notify

on:
  pull_request:
    types: [opened, reopened, closed]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

# Each PR gets its own Zulip topic ("PR #N"), so opened / reviewed / merged
# read as one thread. Untrusted text (titles, branch names) is passed via env
# vars, never interpolated into the script body.
jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    name: Notify PR opened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Zulip
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_TITLE=$(printf '%s' "$PR_TITLE" | tr -d '@[]`\r\n' | cut -c1-100)
          BRANCH=$(printf '%s' "$BRANCH" | tr -d '`\r\n' | cut -c1-100)
          sh scripts/zulip-notify.sh "PR #$PR_NUMBER" "🔀 **New PR opened:** [#$PR_NUMBER $PR_TITLE]($PR_URL)
          **Branch:** \`$BRANCH\`
          DeepSeek review running..."

  notify-pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    name: Notify PR merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Zulip
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE=$(printf '%s' "$PR_TITLE" | tr -d '@[]`\r\n' | cut -c1-100)
          sh scripts/zulip-notify.sh "PR #$PR_NUMBER" "🎉 **PR merged to main:** [#$PR_NUMBER $PR_TITLE]($PR_URL)"

  notify-reviewed:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, 'Automated Code Review')
    name: Notify DeepSeek review posted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Zulip
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          PR_URL: ${{ github.event.issue.html_url }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
        run: |
          PR_TITLE=$(printf '%s' "$PR_TITLE" | tr -d '@[]`\r\n' | cut -c1-100)
          sh scripts/zulip-notify.sh "PR #$PR_NUMBER" "🤖 **DeepSeek review posted:** [#$PR_NUMBER $PR_TITLE]($PR_URL)"

  notify-test:
    if: github.event_name == 'workflow_dispatch'
    name: Test Zulip connection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post test message to Zulip
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
        run: |
          sh scripts/zulip-notify.sh "CI" "✅ Hudo Zulip notifications are working correctly."
