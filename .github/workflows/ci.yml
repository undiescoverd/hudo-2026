name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-check, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can diff against the base branch.
          fetch-depth: 0

      - name: Secret scan
        # Scans only the ADDED lines of this change (see scripts/check-secrets.sh).
        # Backstop for `git push --no-verify`, which skips the local hooks.
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Exact base commit from the event payload (unambiguous, unlike origin/<base_ref>).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Push events: scan the WHOLE pushed range, not just the tip commit.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sh scripts/check-secrets.sh --range "${BASE_SHA}...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            sh scripts/check-secrets.sh --range "${BEFORE_SHA}..HEAD"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            sh scripts/check-secrets.sh --range "HEAD~1..HEAD"
          else
            echo "First commit, nothing to diff against: skipping secret scan"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: `pnpm test` relies on node:test glob expansion ('**/*.test.ts'),
          # which Node 20 (EOL 2026-04) does not support.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  rls-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Start local Supabase
        # Keep only db (PostgreSQL) + gotrue (auth schema); exclude everything else
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run RLS pgTAP tests
        run: supabase test db tests/rls

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  notify-zulip:
    name: Notify Zulip
    runs-on: ubuntu-latest
    needs: [ci, rls-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      # Failures always post; passes only for main (feature-branch passes are noise).
      - name: Post CI result to Zulip
        if: needs.ci.result == 'failure' || needs.rls-tests.result == 'failure' || (needs.ci.result == 'success' && needs.rls-tests.result == 'success' && github.ref == 'refs/heads/main')
        continue-on-error: true
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_RESULT: ${{ needs.ci.result }}
          RLS_RESULT: ${{ needs.rls-tests.result }}
        run: |
          BRANCH=$(printf '%s' "$BRANCH" | tr -d '`\r\n' | cut -c1-100)
          if [ "$CI_RESULT" = success ] && [ "$RLS_RESULT" = success ]; then ICON="✅ **CI passed**"; else ICON="❌ **CI failed**"; fi
          sh scripts/zulip-notify.sh "CI" "$ICON on \`$BRANCH\` — [view run]($RUN_URL)"
