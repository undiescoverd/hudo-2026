name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-check, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can diff against the base branch.
          fetch-depth: 0

      - name: Secret scan
        # Scans only the ADDED lines of this change (see scripts/check-secrets.sh).
        # Backstop for `git push --no-verify`, which skips the local hooks.
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Exact base commit from the event payload (unambiguous, unlike origin/<base_ref>).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Push events: scan the WHOLE pushed range, not just the tip commit.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sh scripts/check-secrets.sh --range "${BASE_SHA}...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            sh scripts/check-secrets.sh --range "${BEFORE_SHA}..HEAD"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            sh scripts/check-secrets.sh --range "HEAD~1..HEAD"
          else
            echo "First commit, nothing to diff against: skipping secret scan"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: `pnpm test` relies on node:test glob expansion ('**/*.test.ts'),
          # which Node 20 (EOL 2026-04) does not support.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  rls-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Start local Supabase
        # Keep only db (PostgreSQL) + gotrue (auth schema); exclude everything else
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run RLS pgTAP tests
        run: supabase test db tests/rls

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [ci, rls-tests]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify success
        if: needs.ci.result == 'success' && needs.rls-tests.result == 'success' && env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          python3 -c "
          import os, json, urllib.request
          payload = json.dumps({
              'text': f':white_check_mark: *CI passed* on \`{os.environ[\"BRANCH\"]}\` — <{os.environ[\"RUN_URL\"]}|view run>'
          }).encode()
          req = urllib.request.Request(os.environ['SLACK_WEBHOOK_URL'], data=payload, headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          "

      - name: Notify failure
        if: (needs.ci.result == 'failure' || needs.rls-tests.result == 'failure') && env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          python3 -c "
          import os, json, urllib.request
          payload = json.dumps({
              'text': f':x: *CI failed* on \`{os.environ[\"BRANCH\"]}\` — <{os.environ[\"RUN_URL\"]}|view run>'
          }).encode()
          req = urllib.request.Request(os.environ['SLACK_WEBHOOK_URL'], data=payload, headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          "
