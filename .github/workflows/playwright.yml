name: Playwright E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override base URL for E2E tests'
        required: false
        default: ''

jobs:
  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-24.04 # Playwright has no chromium build for ubuntu-latest (26.04) yet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || secrets.PLAYWRIGHT_TEST_URL }}
          E2E_TEST_AGENCY_EMAIL: ${{ secrets.E2E_TEST_AGENCY_EMAIL }}
          E2E_TEST_AGENCY_PASSWORD: ${{ secrets.E2E_TEST_AGENCY_PASSWORD }}
          E2E_GUEST_TEST_TOKEN: ${{ secrets.E2E_GUEST_TEST_TOKEN }}
          E2E_AGENCY_A_EMAIL: ${{ secrets.E2E_AGENCY_A_EMAIL }}
          E2E_AGENCY_A_PASSWORD: ${{ secrets.E2E_AGENCY_A_PASSWORD }}
          E2E_AGENCY_B_EMAIL: ${{ secrets.E2E_AGENCY_B_EMAIL }}
          E2E_AGENCY_B_PASSWORD: ${{ secrets.E2E_AGENCY_B_PASSWORD }}
        # Skip gracefully when PLAYWRIGHT_TEST_URL secret is not configured.
        # Tests run against a deployed Vercel URL — set the secret to enable.
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "PLAYWRIGHT_BASE_URL not configured — skipping E2E tests."
            echo "Set the PLAYWRIGHT_TEST_URL GitHub secret to a Vercel deployment URL to enable."
            exit 0
          fi
          pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify-zulip:
    name: Zulip notification
    runs-on: ubuntu-24.04 # Playwright has no chromium build for ubuntu-latest (26.04) yet
    needs: e2e
    # Failures always post; passes only for main.
    if: always() && needs.e2e.result != 'skipped' && (needs.e2e.result != 'success' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Post E2E result to Zulip
        continue-on-error: true
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          JOB_STATUS: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) ICON="✅" ;;
            failure) ICON="❌" ;;
            *) ICON="⚠️" ;;
          esac
          sh scripts/zulip-notify.sh "E2E" "$ICON **Playwright E2E:** $JOB_STATUS — [view run]($RUN_URL)"
