name: Linear Sync Check

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  workflow_dispatch:

jobs:
  sync-check:
    name: Check and fix Linear drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch all refs
        run: git fetch --all --quiet --tags --prune

      - name: Write .env.linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: echo "LINEAR_API_KEY=$LINEAR_API_KEY" > .env.linear

      # --ci: no colour, exit 1 on any DRIFTED / MISSING / ERROR / merged-but-not-done task.
      # continue-on-error so the fix step can run; its outcome decides the next steps.
      - name: Run sync-check
        id: check
        continue-on-error: true
        run: node orchestrate.js sync-check --ci

      # Pushes markdown status to Linear, creates missing issues, then re-checks.
      # Exits 1 if anything is still out of sync (or Linear is unreachable), failing the job.
      - name: Run sync-fix
        id: fix
        if: steps.check.outcome == 'failure'
        run: node orchestrate.js sync-fix --ci

      - name: Notify Slack (drift auto-fixed)
        if: steps.check.outcome == 'failure' && steps.fix.outcome == 'success' && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{"text":"Linear/git sync drift detected and auto-fixed. Run `node orchestrate.js sync-check` to verify."}'

      - name: Notify Slack (sync FAILED)
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"Linear sync FAILED: tasks are still drifted, missing or unreachable after sync-fix. $RUN_URL\"}"

      - name: Cleanup
        if: always()
        run: rm -f .env.linear
